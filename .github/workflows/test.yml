name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show available simulators (diagnostic)
        if: always()
        run: xcrun simctl list devices available

      # gratitudeTests / gratitudeUITests are still the unmodified Xcode
      # template stubs (see CLAUDE.md) - this runs whatever's there today
      # (a trivial Swift Testing case, plus a real app-launch UI test) and
      # will pick up real tests automatically as they're added, with no
      # workflow changes needed.
      - name: Test
        run: |
          xcodebuild \
            -project gratitude.xcodeproj \
            -scheme gratitude \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
