name = "smiles-gratitude"
main = "worker.js"
compatibility_date = "2024-01-01"

# Bind this Worker to the custom domain gratitude.sachabest.com in the
# Cloudflare dashboard (Workers & Pages -> smiles-gratitude -> Settings ->
# Domains & Routes -> Add Custom Domain). Cloudflare handles DNS + TLS for
# you once sachabest.com's nameservers point at Cloudflare.
#
# IMPORTANT: disable Bot Fight Mode / any JS challenge for this hostname —
# iMessage's link-preview fetcher and Apple's apple-app-site-association
# fetcher aren't real browsers and can't pass a challenge. A challenge page
# here silently breaks both the rich iMessage preview and Universal Links.

[vars]
APPLE_APP_ID = "7M62J9KS2A.com.sachabest.gratitude"
# TestFlight public link today; swap to the real App Store link once
# Gratitude ships there. No app rebuild needed either time.
INSTALL_LINK_URL = "https://testflight.apple.com/join/EuGXYNfG"